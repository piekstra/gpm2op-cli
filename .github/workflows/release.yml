name: release

# Cut a release by pushing a tag like `v0.1.0`. One Linux job and ONE macOS
# job (Apple Silicon, which cross-compiles the Intel target — the macOS SDK is
# universal). Build jobs are independent (fail-fast: false), so one failing never
# stops the other, and only one macOS runner is ever needed. A stalled macOS queue
# delays the release for every platform until that job ends.
#
# `publish` attaches whatever was built to a draft, even when one build failed, and
# publishes it only once every expected asset is there. A missing one fails the
# run and leaves the draft, and `self-update` keeps finding the last whole release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: apple (aarch64 + x86_64)
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-latest
            name: linux x86_64
            targets: "x86_64-unknown-linux-gnu"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build and package each target
        run: |
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --target "$t"
            tar -C "target/$t/release" -czf "gpm2op-${{ github.ref_name }}-$t.tar.gz" gpm2op
            shasum -a 256 "gpm2op-${{ github.ref_name }}-$t.tar.gz" > "gpm2op-${{ github.ref_name }}-$t.tar.gz.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            gpm2op-${{ github.ref_name }}-*.tar.gz
            gpm2op-${{ github.ref_name }}-*.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  # The one job that can write. Parallel build jobs creating a draft for the same
  # tag could each make their own, so they hand over artifacts and this attaches
  # them all, then publishes only when nothing expected is missing.
  publish:
    name: publish the release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            dist/gpm2op-*.tar.gz
            dist/gpm2op-*.tar.gz.sha256
      - name: Every expected asset was attached
        run: |
          set -euo pipefail
          missing=0
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            for f in "gpm2op-$GITHUB_REF_NAME-$t.tar.gz" "gpm2op-$GITHUB_REF_NAME-$t.tar.gz.sha256"; do
              [ -f "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
            done
          done
          exit "$missing"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
