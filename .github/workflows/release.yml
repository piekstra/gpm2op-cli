name: release

# Cut a release by pushing a tag like `v0.1.0`. One Linux job and ONE macOS
# job (Apple Silicon, which cross-compiles the Intel target — the macOS SDK is
# universal). Build jobs are independent (fail-fast: false), so one failing never
# stops the other, and only one macOS runner is ever needed. A stalled macOS queue
# delays the release for every platform until that job ends.
#
# `publish` attaches whatever was built to a draft, even when one build failed, and
# publishes it only once every expected asset is there. A missing one fails the
# run and leaves the draft, and `self-update` keeps finding the last whole release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: apple (aarch64 + x86_64)
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-latest
            name: linux x86_64
            targets: "x86_64-unknown-linux-gnu"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build and package each target
        run: |
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --target "$t"
            # Both binaries: pw2op, and the gpm2op alias that a pre-rename
            # install's self-update extracts by name.
            tar -C "target/$t/release" -czf "pw2op-$GITHUB_REF_NAME-$t.tar.gz" pw2op gpm2op
            shasum -a 256 "pw2op-$GITHUB_REF_NAME-$t.tar.gz" > "pw2op-$GITHUB_REF_NAME-$t.tar.gz.sha256"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ runner.os }}
          path: |
            pw2op-${{ github.ref_name }}-*.tar.gz
            pw2op-${{ github.ref_name }}-*.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  # The one job that can write. Parallel build jobs creating a draft for the same
  # tag could each make their own, so they hand over artifacts and this attaches
  # them all, then publishes only when nothing expected is missing.
  publish:
    name: publish the release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            dist/pw2op-*.tar.gz
            dist/pw2op-*.tar.gz.sha256
      - name: Every expected asset was attached
        run: |
          set -euo pipefail
          missing=0
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            for f in "pw2op-$GITHUB_REF_NAME-$t.tar.gz" "pw2op-$GITHUB_REF_NAME-$t.tar.gz.sha256"; do
              [ -f "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
            done
            # A pre-rename install's self-update takes the gpm2op file out of
            # the archive; without it that install cannot update.
            archive="dist/pw2op-$GITHUB_REF_NAME-$t.tar.gz"
            [ -f "$archive" ] || continue
            for bin in pw2op gpm2op; do
              if ! tar -tzf "$archive" | grep -qx "$bin"; then
                echo "::error::$archive has no $bin"; missing=1
              fi
            done
          done
          exit "$missing"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run of an older tag must not move Latest back to it.
          current=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "$current" "$GITHUB_REF_NAME" | sort -V | tail -1)
          latest=false; [ "$newest" = "$GITHUB_REF_NAME" ] && latest=true
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
