[package]
name = "gpm2op"
description = "Idempotently upsert Google/Chrome and Apple Passwords/Safari exports into 1Password via the op CLI."
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-only"
repository = "https://github.com/piekstra/gpm2op-cli"
authors = ["piekstra"]

[[bin]]
name = "gpm2op"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
thiserror = "2"
comfy-table = "7"
url = "2"
tempfile = "3"
clap_complete = "4"
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.1.2" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.1.2" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
